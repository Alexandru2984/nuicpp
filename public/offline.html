<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NuiGraph Studio is offline</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-body">
  <main class="login-shell">
    <div class="login-panel">
      <div class="brand-mark">NG</div>
      <h1>Offline</h1>
      <p>NuiGraph Studio needs a connection to load your diagrams. Any unsaved work is kept in this browser and will still be here when you reconnect.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </main>
</body>
</html>
