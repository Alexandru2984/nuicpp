server {
    server_name nuicpp.micutu.com;

    # Certbot renewals must remain reachable without weakening the application
    # origin guard. This location serves only the fixed ACME challenge root.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Only accept traffic that actually came through Cloudflare.
    # $from_cloudflare_origin is set in conf.d/cloudflare-origin-guard.conf from
    # the real TCP peer. Without this, anyone who learns the origin IP can hit
    # nginx directly and bypass the Cloudflare WAF, rate limiting, and bot
    # protection (matches the other vhosts).
    set $nuicpp_origin_allowed $from_cloudflare_origin;
    if ($nuicpp_origin_allowed = 0) {
        return 403;
    }

    access_log /var/log/nginx/nuicpp.access.log nuicpp_redacted;

    # Imports are capped at MAX_IMPORT_BYTES (1 MiB) by the app; leave headroom
    # for headers and reject anything larger before it is buffered.
    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    proxy_read_timeout 120;
    proxy_send_timeout 120;

    limit_conn nuicpp_conn 24;

    # The app sets these too, as defence in depth for direct access. Drop the
    # upstream copies so each header appears exactly once and this file stays
    # the single authoritative source at the edge; two Content-Security-Policy
    # headers are enforced as their intersection, which is easy to misread.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Permitted-Cross-Domain-Policies;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Origin-Agent-Cluster;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), clipboard-read=(), clipboard-write=(self), display-capture=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Kept in step with the production FRONTEND_SHELL=server policy in
    # applySecurityHeaders(). Enabling the optional Nui shell also requires an
    # explicit, reviewed 'wasm-unsafe-eval' addition here.
    # The cloudflareinsights hosts are for the beacon Cloudflare injects at the
    # edge; 'unsafe-inline' stays out, so its inline loader remains blocked.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; media-src 'none'; frame-src 'none'; connect-src 'self' https://cloudflareinsights.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    # Aggregate Prometheus telemetry is for the local collector only. Real-IP
    # processing turns Cloudflare traffic back into the visitor address, so it
    # cannot satisfy these allow rules even though nginx proxies over loopback.
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        access_log off;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /login {
        limit_req zone=nuicpp_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # Readiness touches PostgreSQL. Give monitors a small burst without letting
    # a public probe turn into an unbounded database workload.
    location = /ready {
        limit_req zone=nuicpp_api burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/ {
        limit_req zone=nuicpp_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Forward only the address nginx observed. The app reads the last
        # X-Forwarded-For entry, so appending the client-supplied chain would be
        # harmless, but sending one value keeps it unambiguous.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nuicpp.micutu.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nuicpp.micutu.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name nuicpp.micutu.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
