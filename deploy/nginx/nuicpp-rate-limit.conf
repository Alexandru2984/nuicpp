# Rate-limit zones for nuicpp.micutu.com. Installed to /etc/nginx/conf.d/.
#
# $binary_remote_addr is the real visitor address: conf.d/cloudflare-realip.conf
# rewrites $remote_addr from CF-Connecting-IP for peers inside the Cloudflare
# ranges, so these buckets are per client rather than per edge node.
#
# The app keeps its own limits (240 writes and 40 creates per 10 minutes, and 8
# failed logins per 10 minutes). These sit in front of it so floods are dropped
# before they reach the single-process C++ service and its database.

# Editor page loads issue a short burst of API calls (session, templates,
# diagram list, one diagram, its versions), hence the generous burst.
limit_req_zone $binary_remote_addr zone=nuicpp_api:10m rate=120r/m;

# Credential stuffing protection. The app blocks after 8 failures in 10
# minutes; this keeps the attempts from arriving in the first place.
limit_req_zone $binary_remote_addr zone=nuicpp_login:1m rate=10r/m;

# Cap concurrent connections per address so a single client cannot hold open
# every worker slot the service has.
limit_conn_zone $binary_remote_addr zone=nuicpp_conn:10m;
