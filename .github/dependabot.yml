version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Bucharest
    open-pull-requests-limit: 5
    groups:
      codeql-action:
        patterns:
          - github/codeql-action

  - package-ecosystem: npm
    directory: /nui-frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Europe/Bucharest
    open-pull-requests-limit: 5
